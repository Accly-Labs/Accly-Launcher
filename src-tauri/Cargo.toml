[package]
name = "accly-launcher"
version = "0.2.0"
description = "Configure supported AI agents for Accly in minutes."
authors = ["Accly Labs"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "accly_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
local = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.4"
tempfile = "3"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-openssl"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
